<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Text Styles and Layouts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            color: #111111;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 20px 0;
        }

        h2 {
            font-size: 20px;
            margin-top: 0;
        }

        p {
            color: #333333;
            line-height: 1.4;
        }

        .container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .box {
            border: 1px solid #d0d0d0;
            padding: 15px;
            width: 220px;
            border-radius: 4px;
        }

        .sidebar p {
            font-style: italic;
        }

        .main-content p {
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1>CSS Text Styles and<br>Layouts</h1>
    
    <hr>

    <h2>Simple Web Layout Using CSS</h2>
    <p>This is a simple example of a web layout using<br>various CSS text styles.</p>

    <div class="container">
        
        <div class="box sidebar">
            <h2>Sidebar</h2>
            <p>The customer itself is very important, the customer will be 
                followed by the customer.
            </p>
        </div>

        <div class="box main-content">
            <h2>Main Content</h2>
            <p>BUT I DO PROVIDE TIME TO INCUR GREAT LABOR AND PAIN</p>
        </div>

    </div>

</body>
</html>
